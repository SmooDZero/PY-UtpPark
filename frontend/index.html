<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Park UTP - Sistema de Estacionamiento</title>

  <!-- Fuente Lato -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a2e0e6ad04.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <!-- BARRA SUPERIOR -->
  <header class="topbar">
    <div class="left-group">
      <button id="hamburger" class="hamburger" aria-label="Abrir menú">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <div class="brand">
        <img src="img/UTP+Portal.png" alt="UTP+Portal" class="brand-img" />
      </div>
    </div>

    <div class="right-group">
      <div class="notifications-icon" id="notificationsIcon">
        <i class="fas fa-bell"></i>
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
      </div>
      <div class="user-panel" id="userDropdown">
        <div class="user-text">
          <span class="hi">Hola,</span>
          <span class="name" id="userName">Usuario</span>
          <div class="code" id="userCode">-</div>
        </div>
        <div class="user-avatar">
          <img src="img/default-user.png" alt="Usuario" class="avatar" id="avatarImg" />
          <i class="fas fa-chevron-down chevron" id="userChevron"></i>
        </div>
        <div class="user-menu" id="userMenu">
          <a href="#" class="user-menu-item" data-section="perfil"><i class="far fa-user-circle"></i> Ver perfil</a>
          <a href="#" class="user-menu-item" data-section="vehiculo"><i class="fas fa-car"></i> Mi vehículo</a>
          <a href="#" class="user-menu-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </div>
      </div>
    </div>
  </header>

  <!-- MENÚ LATERAL -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-user">
      <img src="img/default-user.png" alt="Usuario" id="sidebarAvatar">
      <div class="name" id="sidebarName">Usuario</div>
      <div class="code" id="sidebarCode">-</div>
    </div>

    <ul class="menu-list" id="menuList">
      <!-- Menú dinámico según tipo de usuario -->
    </ul>

    <hr class="sidebar-divider" />

    <div class="sidebar-footer">
      <a href="#" data-section="perfil"><i class="far fa-user-circle"></i> Ver perfil</a>
      <a href="#" data-section="vehiculo"><i class="fas fa-car"></i> Mi vehículo</a>
      <a href="#" id="logoutBtnMobile"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
    </div>
  </nav>

  <!-- Overlay -->
  <div id="overlay" class="overlay hidden"></div>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="mainContent" class="main-content">
    <!-- Secciones se cargan dinámicamente -->
  </main>

  <!-- Modal de Notificaciones -->
  <div id="notificationsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Notificaciones</h2>
        <button class="modal-close" id="closeNotifications">&times;</button>
      </div>
      <div class="modal-body" id="notificationsList">
        <!-- Notificaciones se cargan aquí -->
      </div>
    </div>
  </div>

  <!-- Modal de Chatbot -->
  <div id="chatbotModal" class="modal hidden">
    <div class="modal-content chatbot-modal">
      <div class="modal-header">
        <h2><i class="fas fa-robot"></i> Asistente Virtual</h2>
        <button class="modal-close" id="closeChatbot">&times;</button>
      </div>
      <div class="chatbot-body">
        <div class="chatbot-messages" id="chatbotMessages">
          <div class="chatbot-message bot">
            <p>¡Hola! Soy tu asistente virtual. Puedo ayudarte con preguntas sobre las reglas del estacionamiento y el reglamento nacional de tránsito. ¿En qué puedo ayudarte?</p>
          </div>
        </div>
        <div class="chatbot-input">
          <input type="text" id="chatbotInput" placeholder="Escribe tu pregunta...">
          <button id="sendChatbotMessage"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/gestor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
