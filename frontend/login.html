<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Park UTP</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/login.css" />

  <!-- Fuente Lato -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="login-page">
  <div class="login-container">
    <!-- LADO IZQUIERDO -->
    <div class="login-left">
      <div class="welcome-text">
        <h2>¡Bienvenido a Park UTP!</h2>
        <p>Gestiona tu estacionamiento, consulta disponibilidad y obtén información sobre normas de tránsito.</p>
        <img src="img/login_v2.svg" alt="Login UTP" class="login-illustration" />
      </div>
    </div>

    <!-- LADO DERECHO -->
    <div class="login-right">
      <div class="login-card">
        <img src="img/UTP+Portal.png" alt="UTP Portal Logo" class="portal-logo" />
        <h2>¡Hola!</h2>
        <p>Ingresa tus datos para iniciar sesión.</p>

        <form id="loginForm" onsubmit="return false;">
          <!-- Usuario -->
          <div class="form-group">
            <label for="usuario"><strong>Usuario: código UTP</strong></label>
            <p class="hint">Ejemplo: U22238381, C123456, G001</p>
            <div class="input-group">
              <input type="text" id="usuario" placeholder="Ingresa tu código UTP" required>
              <i class="fas fa-user"></i>
            </div>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password"><strong>Contraseña</strong></label>
            <div class="input-group">
              <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
              <i class="fas fa-eye" id="togglePassword"></i>
            </div>
          </div>

          <div id="errorMessage" class="error-message" style="display: none;"></div>

          <a href="#" class="reset-link">Restablecer contraseña</a>
          <button type="submit" id="loginBtn" disabled>Iniciar Sesión</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
